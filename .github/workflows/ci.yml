name: CI

on:
  push: 
    branch: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set lowercase image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${OWNER}/payment-service:1.0.0" >> $GITHUB_ENV

      - name: Pull image
        run: docker pull $IMAGE

      - name: Run container (detached)
        run: docker run -d --name payment-service -p 8080:8080 $IMAGE

      - name: Verify container
        run: |
          sleep 5
          docker ps 
          docker logs payment-service